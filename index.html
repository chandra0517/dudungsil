<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="description" content="가장 흔한 답이 가장 높이 오른다 — 한국어 서베이 게임">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두둥실 서베이 게임</title>
<style>
/* VOICE: arcade night-panel game, playful but crisp
   IDEA: a pixel-art balloon ascent; the crowd's answer is the lift
   PICTURE: full-screen pixel world scrolling from a forest pond to the far universe
   COLOUR and TYPE: navy scanline panels, pink + cyan accents; Galmuri pixel font (OFL)
   LAYOUT: game fills the screen, HUD on top, one panel docked at the bottom */
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:dark;--ink:#e8f1ff;--dim:#93a7c9;--faint:#5b6f8f;--cyan:#4de3ff;--pink:#ff5d8f;--gold:#ffd166;--panel:#0b1526;--line:#1b3050;--line2:#2b4870;--scan:repeating-linear-gradient(#00000038 0 1px,#0000 1px 3px)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#050a14;color:var(--ink);font:16px/1.5 Galmuri,"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
.vp{position:fixed;inset:0;overflow:hidden;background:#127a66}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;z-index:3}
.alt b{display:block;font-size:clamp(26px,6vw,38px);font-weight:700;line-height:1.05;text-shadow:-2px 0 var(--pink),2px 0 var(--cyan),0 2px 0 #0008;font-variant-numeric:tabular-nums;white-space:nowrap}
.alt span{font-size:13px;color:var(--ink);background:#0b1526c0;padding:1px 6px;border-radius:3px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{background:#0b1526d8;border:1px solid var(--line2);border-radius:3px;padding:3px 9px;font-size:13px;color:var(--dim);white-space:nowrap}
.pill b{color:var(--gold)}
.titlebox{position:absolute;left:0;right:0;top:15%;text-align:center;z-index:2;pointer-events:none;padding:0 12px}
.title{margin:0;font-size:clamp(46px,12vw,84px);font-weight:700;letter-spacing:.14em;line-height:1.05;text-shadow:-4px 0 var(--pink),4px 0 var(--cyan),0 4px 0 #0b1526,0 -2px 0 #0b1526}
.titlebox p{margin:10px auto 0;display:inline-block;background:#0b1526c8;padding:3px 10px;border-radius:3px;font-size:15px}
#marks,#names{position:absolute;inset:0;pointer-events:none;z-index:1}
.mk{position:absolute;left:0;right:0;height:0;border-top:1px dashed #ffffff55}
.mk span{position:absolute;left:10px;top:-19px;font-size:12px;color:#fff;background:#0b1526b0;padding:1px 6px;border-radius:2px;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.nm{position:absolute;transform:translate(-50%,0);font-size:11px;padding:0 5px;border-radius:2px;background:#0b1526cc;color:var(--ink);white-space:nowrap}
.nm.me{color:var(--cyan)}
.tag{position:absolute;transform:translate(-50%,-100%);z-index:2;background:#0b1526eb var(--scan);border:1px solid var(--line2);border-radius:4px;padding:4px 10px;font-size:15px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.tag.on{opacity:1}
.tag:before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top:5px solid var(--line2)}
.stage{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 clamp(8px,2vw,20px) max(10px,env(safe-area-inset-bottom));z-index:4}
.card{width:min(560px,100%);max-height:min(58svh,calc(var(--vvh,100svh) - 70px));overflow:auto;background:#0b1526e6 var(--scan);border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;animation:cin .32s cubic-bezier(.16,1,.3,1)}
@keyframes cin{from{transform:translateY(14px);opacity:0}}
.eb{display:flex;justify-content:space-between;gap:10px;color:var(--cyan);font-size:13px;margin-bottom:6px;letter-spacing:.06em}
.eb .t{color:var(--ink);font-variant-numeric:tabular-nums}
.q{margin:0 0 12px;font-size:clamp(21px,4.6vw,27px);font-weight:700;line-height:1.3;text-wrap:balance}
.bar{height:6px;background:#050a14;border:1px solid var(--line);margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--cyan);width:100%}
.bar.low i{background:var(--pink)}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input:not([type]){flex:1 1 160px;height:44px;border:1px solid var(--cyan);background:#050a14e6;color:var(--ink);border-radius:3px;padding:0 12px;font:18px Galmuri,sans-serif;outline:none}
input::placeholder{color:var(--faint)}
input:focus{box-shadow:inset 0 0 0 1px var(--cyan)}
.k{--f:var(--pink);--e:#9e2552;height:44px;padding:0 18px;border:0;border-radius:3px;background:var(--f);color:#fff;font:700 17px Galmuri,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff40,0 4px 0 var(--e);margin-bottom:4px;white-space:nowrap}
.k:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #ffffff40,0 1px 0 var(--e)}
.k.c{--f:#1aa6c4;--e:#0d5568}.k.g{--f:#22355a;--e:#101d33;color:var(--dim)}.k.y{--f:#e0a52a;--e:#7a5206}
.k:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.k{flex:1}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:#050a14;padding:4px;border:1px solid var(--line);border-radius:3px}
.tabs button{flex:1;height:38px;border:0;border-radius:2px;background:transparent;color:var(--faint);font:700 15px Galmuri,sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--line2);color:var(--ink)}
.desc{color:var(--dim);font-size:14px;margin:0 0 12px;min-height:42px}
.ver{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:2px;color:#0b1526;font-weight:700;font-size:14px;white-space:nowrap}
.pts{font-size:24px;font-weight:700}
.you{color:var(--dim);font-size:14px}
.rows{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.rows li{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#050a14b0;border:1px solid var(--line);border-radius:2px;font-size:15px}
.rows li em{font-style:normal;width:20px;text-align:center;font-weight:700}
.rows li.hit{border-color:var(--gold);background:#3a2f0cb0}
.list{list-style:none;margin:0 0 12px;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.list li small{display:block;color:var(--dim);font-size:13px}
.list li>.chip{flex:none}
.list li .r{display:flex;gap:8px;align-items:center;white-space:nowrap}
.big{font-size:clamp(38px,10vw,56px);font-weight:700;line-height:1;margin:4px 0;text-shadow:-3px 0 var(--pink),3px 0 var(--cyan)}
.sub{color:var(--dim);margin:0 0 12px;font-size:14px}
.note{color:var(--faint);font-size:12px;margin:10px 0 0}
.code{font-size:30px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}td{padding:6px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;white-space:nowrap}
label.cb{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:14px;min-height:36px}
label.cb input{width:18px;height:18px}
select{height:44px;background:#050a14;color:var(--ink);border:1px solid var(--line2);border-radius:3px;font:16px Galmuri,sans-serif;padding:0 8px}
.hide{display:none!important}
@media(max-width:600px){.rows li{padding:4px 6px;font-size:14px}.card{max-height:min(56svh,calc(var(--vvh,100svh) - 70px))}}
.lang{display:flex;justify-content:flex-end;gap:4px;margin:-4px 0 8px}
.lang button{height:30px;padding:0 10px;border:1px solid var(--line2);background:transparent;color:var(--faint);border-radius:2px;font:13px Galmuri,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--ink);background:var(--line2)}
.abar{position:absolute;right:max(10px,env(safe-area-inset-right));width:8px;z-index:3;pointer-events:none;background:#0b1526c0;border:1px solid var(--line2);border-radius:2px;display:none}
.abar:before{content:"";position:absolute;inset:0;background:linear-gradient(#e8706a33,#4de3ff22 60%,#7cf07a33)}
.abar i{position:absolute;left:50%;width:10px;height:12px;margin-left:-5px;margin-bottom:-6px;border-radius:50%/45% 45% 55% 55%;border:1px solid #0b1526;transition:bottom .25s linear}
.abar i.me{width:14px;height:16px;margin-left:-7px;margin-bottom:-8px;border:2px solid #fff;z-index:2}
.abar i span{position:absolute;right:16px;top:-2px;font-size:11px;background:#0b1526d8;padding:0 5px;border-radius:2px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.abar i.me span{color:var(--cyan);top:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:4px 0 14px}
.pd{flex:1;max-width:130px;text-align:center;min-width:0}
.pd b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd small{display:block;color:var(--dim);font-size:12px}
.blk{margin-top:4px;border:1px solid #0b1526;font-size:26px;font-weight:700;color:#0b1526;display:flex;justify-content:center;padding-top:6px;border-radius:2px 2px 0 0;box-shadow:inset 0 2px 0 #ffffff60;animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.p1 .blk{height:88px;background:#ffd166;animation-delay:.5s}.p2 .blk{height:62px;background:#c8d4e8;animation-delay:.25s}.p3 .blk{height:44px;background:#e0955a}
.pd.me b{color:var(--cyan)}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@media(prefers-reduced-motion:reduce){.card,.blk{animation:none}.abar i{transition:none}}
</style>
</head>
<body>
<div class="vp" id="vp">
<canvas id="cv" aria-label="풍선을 타고 하늘로 오르는 크릴"></canvas>
<div id="marks"></div><div id="names"></div><div class="abar" id="abar" aria-hidden="true"></div>
<div class="tag" id="tag"></div>
<div class="hud"><div class="alt"><b id="km">0 m</b><span id="zn">숲 바닥</span></div><div class="hr"><span class="pill"><span data-en="Feathers">깃털</span> <b id="fth">0</b></span><span class="pill hide" id="sc"></span></div></div>
<div class="titlebox" id="tb"><h1 class="title">두둥실</h1><br><p data-en="The most common answer climbs highest">가장 흔한 답이 가장 높이 오른다</p></div>
<div class="stage">

<section class="card" id="home">
<div class="lang" role="group" aria-label="Language"><button data-l="ko" aria-pressed="true">한국어</button><button data-l="en" aria-pressed="false">English</button></div>
<div class="tabs" role="group" aria-label="모드"><button data-m="daily" aria-pressed="true" data-en="Daily">일일</button><button data-m="classic" aria-pressed="false" data-en="Classic">클래식</button><button data-m="endless" aria-pressed="false" data-en="Endless">무한</button></div>
<p class="desc" id="mdesc"></p>
<div class="row"><button class="k" id="go">오르기 시작</button><button class="k c" id="mpbtn" data-en="Multiplayer">멀티플레이</button></div>
<div class="row" style="margin-top:6px"><button class="k g" id="helpbtn" data-en="How to play">게임 방법과 점수</button></div>
</section>

<section class="card hide" id="help">
<div class="eb"><span data-en="How to play">게임 방법</span></div>
<p style="margin:0 0 10px" data-en="Read the question and type the answer you think most people would give. The more common your answer, the higher your krill climbs. In Classic, 1 point is 20 m, so 700 points is 14 km.">질문을 보고 한국 사람 대부분이 할 것 같은 답을 쓰세요. 흔한 답일수록 크릴이 높이 올라가요. 클래식 기준 1점은 20m, 700점이면 14km예요.</p>
<table id="tiers"></table>
<p class="note" id="ainote"></p>
<div class="row" style="margin-top:10px"><button class="k g" data-back data-en="Back">돌아가기</button></div>
</section>

<section class="card hide" id="play">
<div class="eb"><span id="qn"></span><span class="t" id="qt"></span></div>
<div class="bar" id="tm"><i id="tmb"></i></div>
<h2 class="q" id="qq"></h2>
<form id="af"><input id="ai" autocomplete="off" placeholder="가장 흔한 답은?" data-en-ph="Most common answer?" maxlength="30"><button class="k" type="submit" data-en="Submit">제출</button><button class="k g" type="button" id="pass" data-en="Pass">패스</button></form>
<p class="note hide" id="wait"></p>
</section>

<section class="card hide" id="rev">
<div class="eb"><span id="rvh">공개</span><span class="t" id="rvt"></span></div>
<h2 class="q" id="rvq" style="font-size:19px"></h2>
<div class="ver" id="verd"></div>
<ol class="rows hide" id="board"></ol>
<ul class="list hide" id="mpans"></ul>
<div class="row"><button class="k c" id="next">다음 질문</button></div>
</section>

<section class="card hide" id="done">
<div class="eb"><span id="dtitle"></span></div>
<div class="big" id="dkm"></div>
<p class="sub" id="dsub"></p>
<div class="podium hide" id="podium"></div>
<ul class="list" id="dres"></ul>
<div class="row"><button class="k c" id="copy" data-en="Copy results">결과 복사</button><button class="k hide" id="again" data-en="Play again">다시 하기</button><button class="k g" id="home2">처음으로</button></div>
<p class="note" id="dnote"></p>
</section>

<section class="card hide" id="mpl">
<div class="eb"><span data-en="Multiplayer">멀티플레이</span></div>
<form id="nf"><input id="nick" maxlength="12" placeholder="닉네임" data-en-ph="Nickname" aria-label="닉네임" enterkeyhint="go"><button class="k" id="mkroom" type="submit" data-en="Create room">방 만들기</button></form>
<label class="cb" style="margin-bottom:8px"><input type="checkbox" id="pubcb"> <span data-en="Public room (up to 40 players)">공개 방으로 만들기 (최대 40명)</span></label>
<form id="jf"><input id="jcode" inputmode="numeric" maxlength="6" placeholder="6자리 방 코드" data-en-ph="6-digit room code" aria-label="방 코드" enterkeyhint="go"><button class="k c" type="submit" data-en="Join">참가</button></form>
<div class="eb" style="margin-top:14px"><span data-en="Public rooms">공개 방</span></div>
<ul class="list" id="publist"></ul>
<p class="note" id="mpmsg" data-en="Create a room, then send the invite link or room code to your friends.">방을 만든 뒤 초대 링크나 방 코드를 친구에게 보내세요.</p>
<div class="row" style="margin-top:8px"><button class="k g" data-back data-en="Back">돌아가기</button></div>
</section>

<section class="card hide" id="mpr">
<div class="eb"><span data-en="Room code">방 코드</span><span class="t" id="pcount"></span></div>
<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="code" id="rcode"></span><button class="k g" id="copycode" style="flex:0" data-en="Invite">초대하기</button></div>
<ul class="list" id="plist"></ul>
<div class="row" id="hostctl"><select id="rounds" aria-label="질문 수"><option value="5" data-en="5 questions">5문제</option><option value="7" selected data-en="7 questions">7문제</option><option value="10" data-en="10 questions">10문제</option></select><button class="k" id="startmp" data-en="Start game">게임 시작</button></div>
<p class="sub hide" id="waithost" data-en="Waiting for the host to start…">방장이 게임을 시작하기를 기다리는 중…</p>
<div class="row" style="margin-top:8px"><button class="k g" id="leave" data-en="Leave">나가기</button></div>
</section>

</div></div>
<script src="config.js?v=14"></script>
<script src="vendor/supabase.js"></script>
<script>
{
const BANK=`사람들이 가장 자주 잃어버리는 물건은?|우산/양산;휴대폰/핸드폰/폰/스마트폰;지갑;열쇠/키;이어폰/에어팟/무선이어폰;리모컨/티비리모컨;볼펜/펜;장갑
아침에 눈 뜨자마자 제일 먼저 하는 일은?|휴대폰 보기/휴대폰/핸드폰/폰/스마트폰;화장실 가기/화장실;물 마시기/물;알람 끄기/알람;세수/양치/씻기/샤워;기지개/스트레칭;시간 확인/시계;이불 정리/이불
편의점에 가면 자주 사는 것은?|삼각김밥/김밥;음료수/음료/주스/탄산음료;커피;과자/스낵;컵라면/라면;물/생수;도시락;아이스크림
치킨 먹을 때 같이 먹는 것은?|맥주/생맥주/치맥;콜라/사이다/탄산;치킨무/무;감자튀김;소주;샐러드/양배추;떡볶이;밥/치밥
라면 끓일 때 넣어 먹는 재료는?|계란/달걀;파/대파;치즈;김치;만두;떡;햄/스팸;콩나물
‘여름’ 하면 가장 먼저 떠오르는 것은?|수박;바다/해변/해수욕장;에어컨;휴가/여름휴가/방학;아이스크림;모기;장마/비;빙수/팥빙수
겨울에 길거리에서 사 먹는 간식은?|붕어빵/잉어빵;군고구마/고구마;호떡;어묵/오뎅;호빵/찐빵;군밤/밤;계란빵;타코야키
동물원에 가면 가장 보고 싶은 동물은?|사자;판다/푸바오;기린;코끼리;호랑이;원숭이;펭귄;곰/북극곰
학교 다닐 때 가장 좋아했던 과목은?|체육;미술;음악;수학;국어;영어;과학;사회/역사
무인도에 딱 하나만 가져갈 수 있다면?|칼/나이프/맥가이버칼;라이터/성냥/불;물/생수;휴대폰/핸드폰;텐트;라면/음식/식량;책;친구/가족/애인

const HB=0xAC00,CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const jamo=s=>{let o='';for(const ch of s){const c=ch.charCodeAt(0)-HB;o+=c>=0&&c<11172?CHO[c/588|0]+JUNG[(c%588)/28|0]+JONG[c%28]:ch}return o};
function dist(a,b,max){const n=a.length,m=b.length;if(Math.abs(n-m)>max)return max+1;let p2=null,p1=[];for(let j=0;j<=m;j++)p1[j]=j;
 for(let i=1;i<=n;i++){const c=[i];let lo=i;for(let j=1;j<=m;j++){let v=Math.min(p1[j]+1,c[j-1]+1,p1[j-1]+(a[i-1]===b[j-1]?0:1));if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}if(lo>max)return max+1;p2=p1;p1=c}return p1[m]}
const STOP=new Set(['a','an','the','my','your','some','of','for','with','our']);
const stem=w=>w.length>4&&w.endsWith('ies')?w.slice(0,-3)+'y':w.length>4&&/(s|x|z|ch|sh)es$/.test(w)?w.slice(0,-2):w.length>3&&w.endsWith('s')&&!/(ss|us|is)$/.test(w)?w.slice(0,-1):w;
const toksOf=s=>String(s).toLowerCase().normalize('NFC').replace(/&/g,' and ').replace(/[’']/g,'').split(/[^0-9a-z가-힣ㄱ-ㅎㅏ-ㅣ]+/).filter(w=>w&&!STOP.has(w)).map(w=>/^[a-z]+$/.test(w)?stem(w):w);
const keyOf=s=>toksOf(s).join('');
const KSUF=['입니다','이에요','예요','이요','요','이랑','랑','하기','하는거','하는것','할때','이다','을','를','은','는','이','가','도'];
function variants(s){const k=keyOf(s),out=new Set([k]);if(/[가-힣]$/.test(k))for(const f of KSUF)if(k.length>f.length+1&&k.endsWith(f))out.add(k.slice(0,-f.length));return[...out].filter(Boolean)}
const isKo=s=>/[가-힣ㄱ-ㅎ]/.test(s);
const syl=s=>(s.match(/[가-힣]/g)||[]).length;
const tol=s=>{if(isKo(s)){const n=syl(s);return n<=2?0:n<=4?1:n<=7?2:3}const L=s.length;return L<4?0:L<9?1:L<13?2:3};
const tokCache=new Map();const atoks=a=>{let t=tokCache.get(a);if(!t){t=toksOf(a);tokCache.set(a,t)}return t};
const hasRun=(hay,nd)=>{if(!nd.length||nd.length>hay.length)return false;for(let i=0;i+nd.length<=hay.length;i++){let ok=true;for(let j=0;j<nd.length;j++)if(hay[i+j]!==nd[j]){ok=false;break}if(ok)return true}return false};
const GEN=new Set(['latte','shop','mall','theater','theatre','store','park','tree','ride','place','center','centre','room']);
function shortOK(x,y){if(x.length===y.length){let d=[];for(let i=0;i<x.length;i++)if(x[i]!==y[i])d.push(i);return d.length===2&&d[1]===d[0]+1&&x[d[0]]===y[d[1]]&&x[d[1]]===y[d[0]]}
 const L=x.length>y.length?x:y,S=x.length>y.length?y:x;if(L.length-S.length!==1)return false;let i=0;while(i<S.length&&L[i]===S[i])i++;if(L.slice(i+1)!==S.slice(i))return false;return L[i]===L[i-1]||L[i]===L[i+1]||(i===L.length-1&&L[i]==='e')}
const akCache=new WeakMap();
function aliasKeys(p){let c=akCache.get(p);if(!c){c=p.a.map((al,i)=>{const raw=al.concat(p.ea&&p.ea[i]?p.ea[i]:[]);const seen=new Set(),out=[];raw.forEach(r=>{const k=keyOf(r);if(k&&!seen.has(k)){seen.add(k);out.push({k,t:toksOf(r)})}});return out});akCache.set(p,c)}return c}
function match(p,input){
 const vs=variants(input);if(!vs.length)return -1;const keys=aliasKeys(p),it=toksOf(input);
 for(let i=0;i<keys.length;i++)if(keys[i].some(a=>vs.includes(a.k)))return i;
 let best=-1,bl=0;
 keys.forEach((ks,i)=>ks.forEach(a=>{const ok=isKo(a.k)?(a.k.length>=2&&vs.some(v=>v.includes(a.k))):hasRun(it,a.t);if(ok&&a.k.length>bl){best=i;bl=a.k.length}}));
 let bd=99,bi=-1,tie=false,bal=0;
 for(const v of vs){const t=tol(v);if(!t)continue;const ko=isKo(v),vj=ko?jamo(v):v;
  keys.forEach((ks,i)=>ks.forEach(({k:a})=>{if(isKo(a)!==ko)return;const ta=Math.min(t,tol(a));if(!ta)return;
   if(ko){if(a[0]!==v[0])return}else{if(a[0]!==v[0])return;if(Math.min(v.length,a.length)<7&&!shortOK(v,a))return}
   const d=dist(vj,ko?jamo(a):a,ta);if(d>ta)return;if(d<bd){bd=d;bi=i;tie=false;bal=a.length}else if(d===bd&&bi!==i)tie=true}))}
 const fz=bi>=0&&!tie?bi:-1;
 if(best>=0)return fz>=0&&fz!==best&&bal>bl+2?fz:best;
 for(const v of vs){const ko=isKo(v);if(ko?syl(v)<3:v.length<4)continue;let hit=-1,amb=false;
  keys.forEach((ks,i)=>{if(ks.some(({k:a,t:at})=>ko?(a.includes(v)&&v.length/a.length>=.6):(it.length&&at.length===it.length+1&&GEN.has(at[at.length-1])&&it.every((w,j)=>at[j]===w)))){if(hit>=0&&hit!==i)amb=true;else if(hit<0)hit=i}});
  if(hit>=0&&!amb)return hit}
 return fz}
function junk(s){const k=keyOf(s);return !k||(/^[a-z]+$/.test(k)&&!/[aeiouy]/.test(k))||/^[ㄱ-ㅎㅏ-ㅣ]+$/.test(k)||/^(.)\1+$/.test(k)||!/[가-힣a-z0-9]/.test(k)}

function makeRoom(cfg){
 if(!window.supabase||!cfg||!cfg.supabaseUrl||!cfg.supabaseKey)return null;
 const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}});
 const myId=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
 function chan(name){
  let mine={},list=Object.freeze([]),subs=[],ready=false,tq=0;
  const ch=sb.channel(name,{config:{presence:{key:myId,enabled:true}}});
  const build=()=>{let st={};try{st=ch.presenceState()}catch(e){}const arr=[];
   for(const k in st){const m=st[k];if(!m||!m.length)continue;const pr=Object.assign({},m[m.length-1]);delete pr.presence_ref;if(k===myId)continue;arr.push(Object.freeze({peer:k,sameTab:false,isMe:false,kind:'viewer',guest:false,presence:Object.freeze(pr)}))}
   if(Object.keys(mine).length)arr.push(Object.freeze({peer:myId,sameTab:true,isMe:true,kind:'viewer',guest:false,presence:Object.freeze(Object.assign({},mine))}));
   list=Object.freeze(arr);subs.forEach(f=>{try{f({peers:list})}catch(e){}})};
  ch.on('presence',{event:'sync'},build);
  let hs2=[];ch.on('broadcast',{event:'m'},m=>{const pl=m&&m.payload;if(!pl||pl.f===myId)return;hs2.forEach(h=>{try{h(pl)}catch(e){}})});
  let lastT=0;const GAP=10000;
  const push=()=>{if(!ready)return;clearTimeout(tq);const wait=Math.max(50,lastT+GAP-Date.now());tq=setTimeout(()=>{lastT=Date.now();ch.track(Object.assign({},mine)).catch(()=>{})},wait)};
  const joined=new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('timeout')),12000);
   ch.subscribe(s=>{if(s==='SUBSCRIBED'){clearTimeout(to);ready=true;push();res()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){clearTimeout(to);rej(new Error(s))}})});
  const api={presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}build();push();return Promise.resolve()},
   emit(t,d){if(!ready)return Promise.resolve();return ch.send({type:'broadcast',event:'m',payload:{t,f:myId,d}}).then(()=>{},()=>{})},
   on(t,fn){const h=pl=>{if(pl.t===t)fn({peer:String(pl.f),data:pl.d})};hs2.push(h);return()=>{hs2=hs2.filter(x=>x!==h)}},
   peers:()=>list,onPeers(f){subs.push(f);setTimeout(()=>f({peers:list}),0);return()=>{subs=subs.filter(x=>x!==f)}},
   leave(){try{ch.untrack();sb.removeChannel(ch)}catch(e){}return Promise.resolve()}};
  return{api,joined};
 }
 const lobby=chan('dd-lobby');lobby.joined.catch(()=>{});
 return{presence:p=>lobby.api.presence(p),onPeers:f=>lobby.api.onPeers(f),join:async name=>{const c=chan(name);await c.joined;return c.api}};
}

async function judge(p,ans){
 if(junk(ans))return{t:'miss',r:-1};
 if(!sample)return{t:'tree',r:-1};
 const list=p.a.map((al,i)=>`${i+1}. ${al[0]}${p.ea?' ('+p.ea[i][0]+')':''}`).join('\n');
 const prompt=`You judge a Korean "survey says" party game. Players type the answer they think most people would give.\nQuestion: "${p.q}"${p.en?` (English: "${p.en}")`:''}\nRanked survey answers:\n${list}\nPlayer's answer: "${ans}"\nDecide:\n- match: the number of the ranked answer the player's answer clearly means: the same thing, a synonym, a translation (Korean or English), a typo or spelling variant, or a slightly more specific or general wording most people would accept as the same answer. Use 0 if it is a genuinely different answer. Be strict: related but different things are NOT a match (a pencil is not a pen, beer is not soju, a cat is not a tiger).\n- valid: whether the answer is a sensible response to the question at all (nonsense, jokes or unrelated words are not valid).\n- per100: if match is 0 and valid, roughly how many of 100 Korean people would give this answer (0-30).\nReply with JSON only, like {"match":0,"valid":true,"per100":3}`;
 try{let v=await sample.json(prompt,{modelTier:'quick'});if(typeof v==='string')v=JSON.parse(v);if(!v)return{t:'tree',r:-1};const m=Math.round(+v.match||0);if(m>=1&&m<=p.a.length)return{t:tierOf(m-1),r:m-1};if(!v.valid)return{t:'miss',r:-1};const c=+v.per100||0;return{t:c>=8?'cloud':c>=3?'kite':c>=1?'tree':'ground',r:-1}}
 catch(e){if(e&&e.code==='not_granted')sample=null;return{t:'tree',r:-1}}}

 ul.innerHTML=pubRooms.slice(0,20).map(p=>{const b=p.presence.pub,n=Math.max(1,Math.min(40,+b.n||1));return `<li><div>${tx(esc(String(b.nm||'방장').slice(0,12))+'의 방',esc(String(b.nm||'Host').slice(0,12))+"'s room")}<small>${n}/40${tx('명','')} · ${b.ph==='lobby'?tx('대기 중','waiting'):tx('진행 중','in game')}</small></div><button class="k c" data-j="${esc(b.c)}" ${n>=40?'disabled':''}>${tx('참가','Join')}</button></li>`}).join('');
 ul.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>enterRoom(b.dataset.j,false,false))}
$('nf').onsubmit=e=>{e.preventDefault();if($('mkroom').disabled)return;$('nick').blur();enterRoom(String(Math.floor(100000+Math.random()*900000)),true,$('pubcb').checked)};
$('jf').onsubmit=e=>{e.preventDefault();const c=$('jcode').value.trim();if(/^\d{6}$/.test(c))enterRoom(c,false,false);else $('mpmsg').textContent=tx('6자리 숫자 코드를 입력해 주세요.','Enter the 6-digit room code.')};
async function enterRoom(code,asHost,pub){
 if(!room){mpOff();return}
 try{MP.nr=await room.join('dd-'+code)}catch(e){$('mpmsg').textContent=tx('방에 들어갈 수 없어요. 잠시 후 다시 시도해 주세요.',"Couldn't join the room. Try again in a moment.");return}
 Object.assign(MP,{on:true,code,host:asHost,pub,st:null,key:'',seed:'',phAt:Date.now(),joinedAt:Date.now()});G=null;others.clear();me.n=5;me.pal=BAL;climb(me,0);
 const pres={nm:myName(),sc:0,ar:-1,at:null,aa:null,ci:Math.floor(Math.random()*5),nb:BANK.length};
 if(asHost)Object.assign(pres,{host:1,st:{ph:'lobby',n:7}});
 try{await mpSet(pres)}catch(e){}
 overlay.clear();heard.clear();mineAll={};MP.unsub=MP.nr.onPeers(()=>sync(),()=>{});
 try{if(MP.nr.on)MP.nr.on('pl',m=>{const d=m.data;if(!d||typeof d!=='object'||Array.isArray(d))return;heard.set(m.peer,Date.now());const cur=Object.assign({},overlay.get(m.peer)||{});for(const k of OK_F)if(k in d)cur[k]=d[k];overlay.set(m.peer,cur);sync()},()=>{})}catch(e){}
 $('rcode').textContent=code;show('mpr');sync();
}
function leaveRoom(){clearInterval(timer);try{MP.unsub&&MP.unsub();MP.nr&&MP.nr.leave()}catch(e){}if(MP.pub&&room)room.presence({pub:null}).catch(()=>{});Object.assign(MP,{on:false,nr:null,host:false,st:null,pub:false});others.clear();home()}
$('leave').onclick=leaveRoom;
$('copycode').onclick=async()=>{const url=location.origin+location.pathname+'#r'+MP.code;const text=tx(`두둥실 같이 하자! 방 코드 ${MP.code}`,`Play Dudungsil with me! Room code ${MP.code}`)+`\n${url}`;try{if(navigator.share){await navigator.share({text})}else{await navigator.clipboard.writeText(text)}$('copycode').textContent=tx('완료','Done')}catch(e){try{await navigator.clipboard.writeText(text);$('copycode').textContent='복사됨'}catch(_){$('copycode').textContent='복사 실패'}}setTimeout(()=>$('copycode').textContent=tx('초대하기','Invite'),1500)};
const overlay=new Map(),OK_F=['nm','sc','ar','at','aa','sd','st','host','ci','nb'];
const heard=new Map();let mineAll={};
function players(){if(!MP.nr)return[];const now=Date.now(),m=new Map();
 MP.nr.peers().forEach(p=>m.set(p.peer,p));
 heard.forEach((t,peer)=>{if(!m.has(peer)&&now-t<10000)m.set(peer,{peer,sameTab:false,isMe:false,kind:'viewer',guest:false,presence:{}})});
 return[...m.values()].map(p=>{const o=!p.sameTab&&overlay.get(p.peer);return o?Object.assign({},p,{presence:Object.assign({},p.presence,o)}):p}).filter(p=>p.kind==='viewer'&&p.presence&&typeof p.presence.nm==='string')}
function mpSet(patch){if(!MP.nr)return Promise.resolve();for(const k in patch){if(patch[k]===null)delete mineAll[k];else mineAll[k]=patch[k]}try{if(MP.nr.emit)MP.nr.emit('pl',patch).catch(()=>{})}catch(e){}return MP.nr.presence(patch)}
const pname=p=>p.sameTab?tx('나','Me'):String(p.presence.nm).slice(0,12);
const psc=p=>{const v=+p.presence.sc;return Number.isFinite(v)?Math.max(0,Math.min(5000,v)):0};
function validSt(s){return s&&typeof s==='object'&&['lobby','q','rv','end'].includes(s.ph)&&(s.ph==='lobby'||(Number.isInteger(s.r)&&s.r>=0&&s.r<20&&Number.isInteger(s.n)&&s.n>=1&&s.n<=20&&typeof s.seed==='string'&&s.seed.length<20&&(s.q===undefined||(Array.isArray(s.q)&&s.q.length===s.n&&s.q.every(x=>Number.isInteger(x)&&x>=0&&x<5000)))))}
function hostPeer(){return players().filter(p=>p.presence.host&&validSt(p.presence.st)).sort((a,b)=>a.peer<b.peer?-1:1)[0]}
function sync(){
 if(!MP.on)return;const ps=players();let hp=hostPeer();
 if(!hp&&ps.length&&Date.now()-MP.joinedAt>8000&&!ps.some(p=>!p.sameTab&&p.presence.host)){const low=[...ps].sort((a,b)=>a.peer<b.peer?-1:1)[0];if(low.sameTab){mpSet({host:1,st:MP.st||{ph:'lobby',n:7}}).then(sync).catch(()=>{});return}}
 MP.host=!!(hp&&hp.sameTab);
 const st=hp?hp.presence.st:null;
 if(st){const key=st.ph+':'+st.r+':'+st.seed;if(key!==MP.key){MP.key=key;MP.st=st;MP.phAt=Date.now();onState(st)}}
 // others' krills
 const seen=new Set();ps.forEach(p=>{if(p.sameTab)return;seen.add(p.peer);let o=others.get(p.peer);if(!o){o={S:0,from:0,to:0,t0:0,d:1,n:5,pal:PALS[(+p.presence.ci||0)%5]||BAL,ph:hs(p.peer.length)*6};others.set(p.peer,o)}o.label=pname(p);const S=altToS(scoreAlt(psc(p)));if(Math.abs(S-o.to)>.5)climb(o,S)});
 others.forEach((o,id)=>{if(!seen.has(id))others.delete(id)});
 renderRoom();if(MP.st&&MP.st.ph==='rv'&&!$('rev').classList.contains('hide'))renderMpAns();if(MP.st&&MP.st.ph==='end'&&!$('done').classList.contains('hide'))renderEnd();
 if(MP.pub&&MP.host&&room){const pb=JSON.stringify([ps.length,MP.st&&MP.st.ph]);if(pb!==MP.lastPub){MP.lastPub=pb;room.presence({pub:{c:MP.code,nm:myName(),n:ps.length,ph:MP.st?MP.st.ph:'lobby'}}).catch(()=>{})}}
}
function renderRoom(){const ps=players(),hp=hostPeer();$('pcount').textContent=tx(`${ps.length}/40명`,`${ps.length}/40 players`);
 $('plist').innerHTML=[...ps].sort((a,b)=>psc(b)-psc(a)).map(p=>`<li><div>${esc(pname(p))}${hp&&p.peer===hp.peer?' <small style="display:inline;color:var(--gold)">'+tx('방장','host')+'</small>':''}</div><div class="r">${psc(p)}${tx('점',' pts')}</div></li>`).join('');
 $('hostctl').classList.toggle('hide',!MP.host);$('waithost').classList.toggle('hide',MP.host);
 const nbs=ps.map(p=>p.presence.nb).filter(x=>Number.isInteger(x)),old=nbs.some(x=>x!==BANK.length);let w=$('verwarn');if(!w){w=document.createElement('p');w.id='verwarn';w.className='note';$('plist').after(w)}w.textContent=old?(nbs.some(x=>x>BANK.length)?tx('새 버전이 나왔어요. 페이지를 새로고침하면 질문이 더 많아져요.','A newer version is out. Refresh the page to get all the questions.'):tx('옛날 버전을 쓰는 사람이 있어요. 모두 새로고침하면 질문이 더 많아져요. (그래도 같은 질문으로 함께 할 수 있어요.)','Someone has an older version. Everyone should refresh to get all questions (you can still play together).')):'';w.style.display=old?'':'none'}
function setSt(st){mpSet({st,host:1}).then(sync).catch(()=>{})}
function pickQs(n,seed){const ps=players(),lim=Math.max(1,Math.min(BANK.length,...ps.map(p=>Number.isInteger(p.presence.nb)&&p.presence.nb>0?p.presence.nb:BANK.length)));return shuffle(BANK.slice(0,lim),rng('mp'+seed)).slice(0,n)}
$('startmp').onclick=()=>{if(!MP.host)return;const n=+$('rounds').value,seed=String(Date.now()%1e9);setSt({ph:'q',r:0,n,seed,q:pickQs(n,seed)})};
$('again').onclick=()=>{if(!(MP.on&&MP.host))return;const n=MP.st.n,seed=String(Date.now()%1e9);setSt({ph:'q',r:0,n,seed,q:pickQs(n,seed)})};
setInterval(()=>{if(!MP.on)return;sync();if(MP.nr&&MP.nr.emit&&(MP.hb=(MP.hb||0)+1)%2===0){try{MP.nr.emit('pl',Object.assign({},mineAll,MP.host&&MP.st?{st:MP.st,host:1}:{})).catch(()=>{})}catch(e){}}},1500);
setInterval(()=>{if(!MP.on||!MP.host||!MP.st)return;const st=MP.st,now=Date.now();
 if(st.ph==='q'){const ps=players(),all=ps.length&&ps.every(p=>p.presence.ar===st.r&&p.presence.sd===st.seed);if(now>MP.phAt+26500||(all&&now>MP.phAt+1500))setSt({ph:'rv',r:st.r,n:st.n,seed:st.seed,q:st.q})}
 else if(st.ph==='rv'&&now>MP.phAt+8000)setSt(st.r+1<st.n?{ph:'q',r:st.r+1,n:st.n,seed:st.seed,q:st.q}:{ph:'end',r:st.r,n:st.n,seed:st.seed,q:st.q})},300);
function onState(st){
 if(st.ph==='lobby'){clearInterval(timer);G=null;show('mpr');return}
 if(st.seed!==MP.seed){MP.seed=st.seed;MP.podHTML='';MP.score=0;MP.res=[];climb(me,0);mpSet({sc:0,ar:-1,at:null,aa:null,sd:st.seed}).catch(()=>{})}
 const okq=Array.isArray(st.q)&&st.q.every(x=>x<BANK.length),list=okq?st.q:shuffle(BANK,rng('mp'+st.seed)).slice(0,st.n);
 if(st.ph==='q'){G={mode:'mp',list,i:st.r,n:st.n,score:MP.score,res:MP.res,balloons:5};ask()}
 else if(st.ph==='rv'){clearInterval(timer);mpReveal(list,st)}
 else if(st.ph==='end'){clearInterval(timer);show('done');renderEnd()}
}
function mpAnswered(t,text){MP.score=G.score;mpSet({sc:G.score,ar:G.i,at:t,aa:(text||'').slice(0,30),sd:MP.seed}).catch(()=>{});
 $('af').classList.add('hide');$('tm').classList.add('hide');$('wait').classList.remove('hide');$('wait').textContent=`${tn(t)} +${T[t][1]} · ${tx('다른 사람을 기다리는 중…','waiting for others…')}`}
function mpReveal(list,st){const p=BANK[list[st.r]];show('rev');$('rvh').textContent=tx(`공개 · 질문 ${st.r+1} / ${st.n}`,`Reveal · Question ${st.r+1} / ${st.n}`);$('rvt').textContent=`${MP.score||0}${tx('점',' pts')}`;$('rvq').textContent=qtext(p);
 const L=G&&G.answered&&G.i===st.r?G.last:null;$('verd').innerHTML=L?verdictHTML(L):`<span class="you">${tx('이번 질문엔 답하지 못했어요.',"You didn't answer this one.")}</span>`;
 $('board').innerHTML=boardHTML(p,L?L.r:-1);$('mpans').classList.remove('hide');$('next').classList.add('hide');renderMpAns()}
function renderMpAns(){const st=MP.st;const ps=[...players()].sort((a,b)=>psc(b)-psc(a));
 $('mpans').innerHTML=ps.map(p=>{const ok=p.presence.ar===st.r&&p.presence.sd===st.seed,t=ok&&Object.prototype.hasOwnProperty.call(T,p.presence.at)?p.presence.at:'miss';return `<li><div>${esc(pname(p))}<small>${ok?esc(String(p.presence.aa||tx('(패스)','(passed)')).slice(0,30)):tx('(답 없음)','(no answer)')}</small></div><div class="r"><span class="chip" style="background:${T[t][2]}">${tn(t)}</span>${psc(p)}${tx('점',' pts')}</div></li>`}).join('')}
function renderEnd(){const ps=[...players()].sort((a,b)=>psc(b)-psc(a)),mine=ps.findIndex(p=>p.sameTab);
 const rank=p=>1+ps.filter(q=>psc(q)>psc(p)).length,pod=ps.slice(0,3),slot=i=>{const p=pod[i];return `<div class="pd p${i+1}${p&&p.sameTab?' me':''}"><b>${p?esc(pname(p)):'—'}</b><small>${p?psc(p)+tx('점',' pts'):''}</small><div class="blk">${p?rank(p):i+1}</div></div>`};
 const ph=slot(1)+slot(0)+slot(2);if(ph!==MP.podHTML){MP.podHTML=ph;$('podium').innerHTML=ph}$('podium').classList.remove('hide');
 $('dtitle').textContent=tx(`멀티플레이 · 방 ${MP.code}`,`Multiplayer · Room ${MP.code}`);const myRank=mine<0?0:1+ps.filter(q=>psc(q)>psc(ps[mine])).length;$('dkm').textContent=myRank===1?tx('1등!','1st!'):tx(`${myRank}등`,ord(myRank));$('dsub').textContent=`${MP.score||0}${tx('점',' pts')} · ${fmtAlt(scoreAlt(MP.score||0))}`;
 $('dres').innerHTML=ps.map((p,i)=>`<li><div>${1+ps.filter(q=>psc(q)>psc(p)).length}. ${esc(pname(p))}<small>${fmtAlt(scoreAlt(psc(p)))}</small></div><div class="r">${psc(p)}${tx('점',' pts')}</div></li>`).join('');
 $('again').classList.toggle('hide',!MP.host);$('dnote').textContent=MP.host?'':tx('방장이 다시 시작할 수 있어요.','The host can start a new game.');$('home2').textContent=tx('나가기','Leave');
 G={share:`두둥실 멀티플레이 ${myRank}등 / ${ps.length}명\n🎈 ${fmtAlt(scoreAlt(MP.score||0))} (${MP.score||0}${tx('점',' pts')})`}}

function drawTiers(){$('tiers').innerHTML=Object.keys(T).map(k=>`<tr><td><span class="chip" style="background:${T[k][2]}">${tn(k)}</span></td><td>${tx(T[k][3],TDE[k])}</td><td>${T[k][1]}${tx('점',' pts')}</td></tr>`).join('')}
function applyLang(){document.documentElement.lang=lang;
 document.querySelectorAll('[data-en]').forEach(el=>{if(el.dataset.ko===undefined)el.dataset.ko=el.textContent;el.textContent=lang==='en'?el.dataset.en:el.dataset.ko});
 document.querySelectorAll('[data-en-ph]').forEach(el=>{if(el.dataset.koPh===undefined)el.dataset.koPh=el.placeholder;el.placeholder=lang==='en'?el.dataset.enPh:el.dataset.koPh});
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));drawTiers();setAiNote()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('dd-lang',lang)}catch(e){}applyLang();if(curScreen==='home')home();else if(curScreen==='play'&&G&&G.list)$('qq').textContent=qtext(BANK[G.list[G.i]])});
applyLang();
home();
}
</script>
